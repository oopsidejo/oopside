<style>
:root{
  --ink:#16183d; --indigo:#2f3b82; --indigo-2:#4553b0; --paper:#fafafd; --card:#ffffff; --lilac:#ecebfa; --line:#dcdcee;
  --on:#ffffff; --muted:#5d6080; --sun:#ffc83d; --sun-ink:#3a2a00; --mint:#1e8c63; --mint-bg:#e1f4ec; --coral:#c8402f; --coral-bg:#fbe5e1;
  --f-d:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif; --f-b:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#ecebff; --indigo:#9aa6ff; --indigo-2:#b7c0ff; --paper:#10122a; --card:#181b3a; --lilac:#20244b; --line:#2e3263;
  --on:#10122a; --muted:#a4a7cc; --sun:#ffd166; --sun-ink:#2a1e00; --mint:#5fd3a2; --mint-bg:#123329; --coral:#ff8a76; --coral-bg:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#ecebff; --indigo:#9aa6ff; --indigo-2:#b7c0ff; --paper:#10122a; --card:#181b3a; --lilac:#20244b; --line:#2e3263;
  --on:#10122a; --muted:#a4a7cc; --sun:#ffd166; --sun-ink:#2a1e00; --mint:#5fd3a2; --mint-bg:#123329; --coral:#ff8a76; --coral-bg:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--f-b);direction:rtl;-webkit-font-smoothing:antialiased}
a{color:var(--indigo)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(30px,5.4vw,54px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(23px,3.2vw,32px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.m{color:var(--muted)}
.hidden{display:none!important}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 22px var(--f-d);letter-spacing:.02em}
.brand img{height:36px;width:auto;max-width:140px;object-fit:contain}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--sun);display:inline-block;margin-inline-start:2px}
nav.links{display:flex;gap:6px;align-items:center}
nav.links a{text-decoration:none;color:var(--muted);font-weight:500;padding:6px 10px;border-radius:8px}
nav.links a:hover{color:var(--ink);background:var(--lilac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font:700 16px var(--f-d);cursor:pointer;text-decoration:none;min-height:48px;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--indigo);color:var(--on)}
.btn.pri:hover{background:var(--indigo-2)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--indigo)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
@media (max-width:720px){nav.links a.nl{display:none}}

/* ---------- hero ---------- */
.hero{padding:56px 0 30px}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.hero p.sub{font-size:clamp(16px,2vw,19px);color:var(--muted);margin-top:16px;max-width:60ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.qgifts{margin:16px 0;border:1px dashed var(--mint);background:var(--mint-bg);border-radius:12px;padding:12px 14px;display:grid;gap:6px}.qgifts h3{margin:0 0 4px;font-size:16px}.qgifts div{display:flex;justify-content:space-between;gap:10px}.qgifts b{color:var(--mint);white-space:nowrap}.qgifts s{color:var(--muted);font-weight:400}
.qplan3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.qplan3>div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--lilac)}.qplan3 em{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--indigo);color:var(--on);font-weight:700;font-size:13px;margin-inline-end:6px}.qplan3 ul{margin:8px 0 0;padding-inline-start:18px;display:grid;gap:4px;font-size:14px}
.qsugg{margin:8px 0 0;padding-inline-start:20px;display:grid;gap:4px}
.adsx{color:var(--indigo);font-weight:600;border:1px dashed var(--indigo);border-radius:8px;padding:4px 8px;margin-top:4px}
.qdead{margin-top:12px;background:var(--coral-bg);color:var(--coral);padding:8px 12px;border-radius:10px}
.qsign{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--indigo);border-radius:12px;padding:12px 14px}
@media (max-width:700px){.qplan3{grid-template-columns:1fr}}
@media print{.qplan3>div{break-inside:avoid}}
.qscope{margin:8px 0 0;padding:0 18px 0 0;display:grid;gap:4px}.qscope li::marker{content:"✓  ";color:var(--mint);font-weight:700}
.qcard{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(22,24,61,.18),0 0 0 2px var(--mint);display:block}
.qhead{display:flex;gap:12px;align-items:center;padding:16px 18px;background:linear-gradient(135deg,#2f3b82,#1e6b5a);color:#fff}
.qhead img{width:46px;height:46px;border-radius:12px;object-fit:contain;background:#fff;padding:3px}
.qhead b{display:block;font:800 22px/1.3 var(--f-d)}
.qoffer{display:inline-block;margin-top:6px;background:var(--sun);color:var(--sun-ink);border:0;border-radius:10px;padding:5px 12px;font:800 15px var(--f-d);cursor:pointer;animation:qglow 2.4s ease-in-out infinite}
@keyframes qglow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.55)}50%{box-shadow:0 0 0 7px rgba(255,200,61,0)}}
.qbody{padding:14px 18px 16px;display:grid;gap:10px}
.qpts{margin:0;padding:0 18px 0 0;color:var(--ink);display:grid;gap:3px;font-weight:500}
.qpts li{cursor:pointer}.qpts li::marker{content:"✓  ";color:var(--mint);font-weight:800}
.qin{display:flex;align-items:center;gap:0;border:2px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;transition:border-color .15s}
.qin:focus-within{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(47,59,130,.15)}
.qin.ok{border-color:var(--mint)}
.qin i{font-style:normal;padding:0 10px 0 4px;opacity:.75}
.qin input,.qin select{border:0!important;box-shadow:none!important;background:transparent;min-height:50px;font:600 17px var(--f-b);color:var(--ink);outline:0}
.qin input{flex:1;min-width:0;padding:0 12px}
.qph select{flex:none;max-width:118px;padding:0 8px;border-inline-start:1px solid var(--line)!important;direction:ltr;font-size:15px}
.qok{font-style:normal;color:var(--mint);font-weight:800;padding:0 12px;display:none}.qin.ok .qok{display:block}
.qgo{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:14px;background:#1fa855;color:#fff;font:800 18px var(--f-d);cursor:pointer;box-shadow:0 8px 20px rgba(31,168,85,.35)}
.qgo:hover{background:#178a45}.qgo:disabled{opacity:.75;cursor:wait}
.qcard .err:empty{display:none}
.qofw{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}.qofw .qoffer{margin-top:0}
.qterms{color:#fff;opacity:.85;font-size:13px;text-decoration:underline}
.qwa{display:block;text-align:center;color:#1fa855;font-weight:700;font-size:15px;text-decoration:underline;padding:2px}
.proof{padding-top:8px}
.founder{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:24px;align-items:center;margin-bottom:28px}
.founder h2{font-size:28px;margin-bottom:6px}.founder .btn{margin-top:14px}
.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:16px;overflow:hidden;background:#000;cursor:pointer}
.vid.tall{aspect-ratio:9/16}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.92}
.vid i{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(31,168,85,.95);color:#fff;font:700 26px/64px var(--f-d);font-style:normal;box-shadow:0 8px 24px rgba(0,0,0,.35)}
iframe.vid{cursor:auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.tcard{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tcard .vid{border-radius:0}.tcard figcaption{padding:12px 14px;display:grid;gap:4px}
.tcard blockquote{margin:0;font-weight:500}.tres{justify-self:start;background:var(--mint-bg);color:var(--mint);font-weight:700;border-radius:8px;padding:2px 10px;font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:12px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.ba{display:flex;align-items:center;gap:10px;margin:4px 0}.ba div{display:grid;background:var(--lilac);border-radius:10px;padding:6px 12px}.ba .aft{background:var(--mint-bg);color:var(--mint)}.ba strong{font:800 20px var(--f-d)}.ba small{font-size:12px;opacity:.8}
.disc{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:700px){.founder{grid-template-columns:1fr}.founder .fvid{max-width:280px;margin:0 auto;width:100%}}
.qtrust{margin:0;text-align:center;color:var(--mint);font-weight:700;font-size:14px}
@media (prefers-reduced-motion:reduce){.qoffer{animation:none}}
.qnote{text-align:center}
.qrow{display:grid;gap:10px}
.qmore summary{cursor:pointer;color:var(--muted);font-size:14px;padding:2px 0}.qmore[open] summary{margin-bottom:8px}.qmore .fld{margin-top:8px}
@media (max-width:700px){.qhead{padding:13px 14px}.qhead b{font-size:19px}.qbody{padding:12px 14px 14px;gap:8px}.qpts{font-size:14px;gap:2px}}
@media (max-width:860px){body:not(.bshow) .mbar{display:none!important}}
@media (max-width:700px){body:not(.bshow) #wa{display:none!important}}
.qcard .fld{margin-top:0}
.qdone{text-align:center;padding:20px 8px}.qdone b{font:800 20px var(--f-d)}
.steps3{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:s}
.steps3 li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.steps3 li::before{content:counter(s);font:800 20px var(--f-d);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--lilac);color:var(--indigo)}
.steps3 li:last-child::before{background:var(--sun);color:var(--sun-ink)}
.steps3 b{display:block;font-family:var(--f-d);font-weight:700}
.steps3 span{font-size:14px;color:var(--muted)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero{padding-top:34px}.hero .qcard{order:-1}}

/* ---------- builder ---------- */
section.sec{padding:40px 0}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.sechead p{color:var(--muted);max-width:62ch}
.builder{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:26px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.prog{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.prog button{flex:1;min-width:76px;border:0;background:none;padding:0;cursor:pointer;text-align:start;color:var(--muted);font:500 13px var(--f-b)}
.prog button i{display:block;height:6px;border-radius:4px;background:var(--line);margin-bottom:6px}
.prog button.done i{background:var(--indigo)}
.prog button.on{color:var(--ink);font-weight:600}
.prog button.on i{background:var(--sun)}
.prog button[disabled]{cursor:default}
.step h2{margin-bottom:6px}
.step > p.m{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;cursor:pointer;font:500 15px var(--f-b);text-align:start;line-height:1.4;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--indigo-2)}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--on)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;font:600 15px var(--f-b);text-align:start;min-height:52px}
.tile[aria-pressed="true"]{border-color:var(--indigo);background:var(--lilac);color:var(--indigo)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 16px;cursor:pointer;font:500 15px var(--f-b);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--on)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld > span{font-size:14px;font-weight:600}
.fld small{color:var(--muted);font-size:13px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 13px;min-height:48px;font-size:16px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--indigo) 22%,transparent)}
.ask{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--lilac);border-inline-start:4px solid var(--indigo)}
.ask h3{font-size:15px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.err{color:var(--coral);font-weight:600;margin-top:12px;min-height:1.5em}

/* budget */
.bigmoney{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.bigmoney input{font:800 clamp(40px,7vw,64px)/1 var(--f-d);border:0;background:none;width:5.2ch;padding:0;color:var(--indigo);text-align:start;-moz-appearance:textfield}
.bigmoney input::-webkit-outer-spin-button,.bigmoney input::-webkit-inner-spin-button{-webkit-appearance:none}
.bigmoney span{font:700 20px var(--f-d);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--indigo);height:32px}
.toggle{display:flex;gap:12px;align-items:flex-start;margin-top:18px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--indigo);margin-top:3px;flex:none}
.split{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{border-radius:12px;padding:12px 14px;background:var(--paper);border:1px solid var(--line)}
.split small{display:block;color:var(--muted);font-size:13px}
.split b{font:700 22px var(--f-d)}
.planbox{margin-top:18px;border-radius:16px;border:1.5px dashed var(--indigo);padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* services */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.svcs{display:grid;gap:10px}
.svc{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card);display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
.svc.on{border-color:var(--indigo);box-shadow:inset 4px 0 0 var(--indigo)}
.svc .nm{font:700 16px var(--f-d)}
.svc .ds{font-size:14px;color:var(--muted)}
.svc .dur{color:var(--indigo);font-weight:600;margin-top:2px}
.svc .pr{font:600 14px var(--f-b);color:var(--indigo);white-space:nowrap}
.svc .why{grid-column:1/-1;font-size:13px;background:color-mix(in srgb,var(--sun) 28%,transparent);border-radius:8px;padding:4px 10px;justify-self:start}
.svc .act{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.svc .ctl{grid-column:1/-1}
.add{border:1.5px solid var(--indigo);background:none;color:var(--indigo);border-radius:10px;padding:6px 14px;min-height:40px;font:700 14px var(--f-d);cursor:pointer;white-space:nowrap}
.svc.on .add{background:var(--indigo);color:var(--on)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--lilac);width:38px;height:38px;font:700 18px var(--f-d);cursor:pointer;color:var(--indigo)}
.stepper output{min-width:40px;text-align:center;font:700 16px var(--f-d)}
.team{margin-top:8px;padding:14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;gap:12px}
.team .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.team label.l{font-size:14px;font-weight:600;min-width:110px}
.warn{background:var(--coral-bg);color:var(--coral);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.okk{background:var(--mint-bg);color:var(--mint);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}

/* receipt: the memorable bit */
.receipt{position:sticky;top:78px;background:var(--card);border-radius:18px 18px 0 0;padding:20px 20px 26px;filter:drop-shadow(0 10px 24px color-mix(in srgb,var(--indigo) 18%,transparent));
  --cut:radial-gradient(circle at 10px 0,transparent 9px,var(--card) 9.5px);}
.receipt::after{content:"";position:absolute;inset-inline:0;bottom:-10px;height:12px;background:var(--cut);background-size:20px 12px;background-repeat:repeat-x}
.rhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:8px}
.rhead b{font:800 18px var(--f-d)}
.rlines{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto}
.rlines li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;animation:print .28s ease-out}
.rlines li small{display:block;color:var(--muted);font-size:12px}
.rlines li b{font-family:var(--f-d);font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes print{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rempty{color:var(--muted);font-size:14px;padding:14px 0}
.rsum{margin-top:10px;display:grid;gap:4px;font-size:14px}
.rsum div{display:flex;justify-content:space-between;gap:8px}
.rsum b{font-family:var(--f-d);font-variant-numeric:tabular-nums}
.rsum .ads{background:repeating-linear-gradient(-45deg,var(--lilac) 0 6px,transparent 6px 12px);border-radius:8px;padding:6px 8px}
.rsum .gift{background:var(--mint-bg);color:var(--mint);border-radius:8px;padding:6px 8px;font-weight:600}
.rsum .gift s{opacity:.7;font-weight:400}
.rsum .saved{border:1.5px dashed var(--mint);color:var(--mint);border-radius:10px;padding:8px 10px;margin-top:8px;font-weight:700;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.rsum .saved{animation:none}}
.freetag{display:inline-block;background:var(--mint-bg);color:var(--mint);border-radius:6px;padding:1px 6px;font-weight:600;margin-inline-start:4px}
.rsum .tot{border-top:2px dashed var(--line);padding-top:8px;margin-top:4px;font-size:16px}
.rsum .tot b{font-size:24px;color:var(--indigo)}
.gauge{margin-top:12px}
.gauge .bar{height:10px;border-radius:6px;background:var(--lilac);overflow:hidden}
.gauge .bar i{display:block;height:100%;background:var(--mint);border-radius:6px;transition:width .3s}
.gauge.over .bar i{background:var(--coral)}
.gauge p{font-size:13px;margin-top:6px}
.rfoot{font-size:12px;color:var(--muted);margin-top:12px}
.mbar{display:none}
@media (max-width:980px){
  .builder{grid-template-columns:minmax(0,1fr)}
  .panel{padding:18px 14px}
  .receipt{position:fixed;inset-inline:0;bottom:0;top:auto;z-index:30;border-radius:18px 18px 0 0;max-height:78vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s}
  .receipt::after{display:none}
  body.rshow .receipt{transform:none}
  .mbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:25;background:#2f3b82;color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:10px}
  .mbar b{font:800 20px var(--f-d)}
  .mbar small{display:block;font-size:12px;opacity:.8}
  .mbar button{background:var(--sun);color:var(--sun-ink);border:0;border-radius:10px;padding:8px 14px;font:700 14px var(--f-d);min-height:42px}
  body{padding-bottom:76px}
  .rclose{display:inline-flex!important}
}
.rclose{display:none}

/* tools */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font:700 15px var(--f-d);cursor:pointer;min-height:46px}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:860px){.calc{grid-template-columns:1fr}}
.out{background:var(--ink);color:var(--paper);border-radius:20px;padding:22px}
.out .big{font:800 clamp(34px,5vw,48px)/1.1 var(--f-d);color:var(--sun);margin:6px 0}
.out .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--paper) 18%,transparent);font-size:15px}
.out .kv b{font-family:var(--f-d);font-variant-numeric:tabular-nums}
.out p.note{font-size:13px;opacity:.75;margin-top:12px}
.range3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.range3 div{background:color-mix(in srgb,var(--paper) 10%,transparent);border-radius:12px;padding:10px;text-align:center}
.range3 small{display:block;font-size:12px;opacity:.75}
.range3 b{font:800 22px var(--f-d)}
.src{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;background:var(--lilac);color:var(--indigo);font-weight:600}

/* faq + footer */
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font:700 17px var(--f-d);list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";color:var(--indigo);font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
details p{margin-top:8px;color:var(--muted)}
footer{background:var(--ink);color:var(--paper);padding:34px 0 40px;margin-top:40px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between}
footer a{color:var(--sun)}
footer .brand{color:var(--paper)}
.fcol{display:flex;flex-direction:column;gap:4px}
.fsoc{display:flex;gap:10px;flex-wrap:wrap}
.fsoc a{color:var(--paper);opacity:.85;text-decoration:none;border:1px solid color-mix(in srgb,var(--paper) 30%,transparent);border-radius:8px;padding:2px 10px;font-size:14px}
.wa{position:fixed;z-index:26;inset-inline-start:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#06301a;border-radius:999px;padding:10px 16px 10px 14px;font:700 15px var(--f-d);text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.wa[hidden]{display:none}
@media (max-width:980px){.wa{bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:12px}.wa span{display:none}}
.cinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cinfo div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cinfo small{display:block;color:var(--muted);font-size:13px}
.cinfo b{font-family:var(--f-d)}
dialog{border:0;border-radius:18px;max-width:560px;width:calc(100% - 32px);padding:24px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,40,.5)}

/* success + quote */
.done{text-align:center;padding:30px 10px}
.done .no{font:800 clamp(44px,9vw,80px)/1 var(--f-d);color:var(--indigo);margin:12px 0}
.done ol{text-align:start;max-width:440px;margin:18px auto;padding-inline-start:20px}
.done ol li{margin:6px 0}
.qt{max-width:820px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.qt table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.qt th,.qt td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.qt th{font-size:13px;color:var(--muted);font-weight:600}
.qt td.n{font-family:var(--f-d);white-space:nowrap}
.stamp{display:inline-block;font:700 14px var(--f-d);padding:4px 12px;border-radius:8px;background:var(--lilac);color:var(--indigo)}
.stamp.good{background:var(--mint-bg);color:var(--mint)}
.stamp.bad{background:var(--coral-bg);color:var(--coral)}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:30px 16px}
@media print{
  header.top,footer,.mbar,.noprint,#tools,#faq,.hero{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .qt{border:0;margin:0;max-width:none}
}
.adsplit{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.adsplit summary{cursor:pointer;font-weight:600}
</style>

/* رسائل الأخطاء: ما منوري الزبون أي رسالة تقنية */

function livePing() {

    d = {sector: S.sector, company: S.company, city: S.city, stage: S.stage, budget: N(S.budget), ad: adBudget(), fees: t.fees, one: t.one_time,
      problems: (S.problems || []).map(plabel), items: L.map(l => ({n: l.s.name, q: l.qty}))};
  } catch (e) {}
  const st = /[?&]q=/.test(location.search) ? 0 : (S.started || S.step ? N(S.step) + 1 : 0);
  sb.rpc('oops_ping', {vid: VID, step: st, utm: utm(), dev: innerWidth < 760 ? 'جوال' : 'كمبيوتر', d}).then(r => { if (r?.error && /oops_ping|function/i.test(r.error.message || '')) pingOff = true; }, () => {});

const pingSoon = () => { clearTimeout(pingT); pingT = setTimeout(livePing, 2500); };

function stepUrl(push) {

  try { history[push ? 'pushState' : 'replaceState']({step: S.step}, '', u); } catch (e) {}

/* ---------- utm: بنحفظ مصدر الزيارة أول ما يفوت ---------- */
const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','ad','fbclid','gclid','ref'];
(function keepUtm() {
  const got = {}; UTM_KEYS.forEach(k => { const v = qs.get(k); if (v) got[k] = v.slice(0, 120); });
  try { if (Object.keys(got).length) sessionStorage.setItem('oops-utm', JSON.stringify(got)); } catch (e) {}
  if (!got.utm_source && document.referrer && !document.referrer.includes(location.host)) { try { if (!sessionStorage.getItem('oops-utm')) sessionStorage.setItem('oops-utm', JSON.stringify({ref: new URL(document.referrer).host})); } catch (e) {} }
})();
const utm = () => { try { return JSON.parse(sessionStorage.getItem('oops-utm') || '{}'); } catch (e) { return {}; } };

  try { if (window.gtag) gtag('event', {Lead: 'generate_lead', ViewContent: 'view_item_list', InitiateCheckout: 'begin_checkout', Contact: 'whatsapp_click', BuilderDone: 'builder_completed', CalcStart: 'calculator_started', VideoPlay: 'video_start'}[ev] || ev, data || {}); } catch (e) {}
  try { (window.dataLayer = window.dataLayer || []).push({event: 'oops_' + ev, ...(data || {})}); } catch (e) {}
};
function loadClarity(id) {
  id = String(id || '').toLowerCase().replace(/[^a-z0-9]/g, ''); if (!id || window.clarity) return;
  (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, 'clarity', 'script', id);
}

    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

  if (gtm) { window.dataLayer = window.dataLayer || []; dataLayer.push({'gtm.start': Date.now(), event: 'gtm.js'}); const t = document.createElement('script'); t.async = true; t.src = 'https://www.googletagmanager.com/gtm.js?id=' + gtm; document.head.appendChild(t); }

/* ---------- حالة الباني ---------- */
const blank = () => ({step: 0, maxStep: 0, split: {}, problems: [], problem_other: '', sector: '', company: '', city: 'عمّان', stage: '', agency_now: '', answers: {}, about: '',
  budget: 600, includes_ads: true, ad: 300, items: {}, contact: '', phone: '', email: '', website: '', social: '', consent: false, marketing_ok: false, cat: 'مقترحة', started: false});
let S = Object.assign(blank(), ls.get('oops-draft') || {});
const save = () => { ls.set('oops-draft', S); if (typeof pingSoon === 'function') pingSoon(); };
const svc = id => SITE.services.find(s => s.id === id);
const problems = () => SITE.config.problems || [];
const plabel = k => problems().find(p => p.k === k)?.l || k;
const adBudget = () => S.includes_ads ? Math.min(N(S.ad), N(S.budget)) : N(S.ad);
const feesBudget = () => S.includes_ads ? Math.max(0, N(S.budget) - adBudget()) : N(S.budget);
function lines() {
  return Object.entries(S.items).map(([id, it]) => { const s = svc(id); if (!s) return null; const pr = P.price(s, it.qty, adBudget(), it.opts);
    // رسوم الإعداد مجاناً: بتنشال من السعر وبتطلع للعميل كخصم
    let waived = 0; if (SITE.config?.setup_free && N(s.setup_fee) > 0) { waived = Math.min(N(pr.one_time), s.ptype === 'team' ? N(s.setup_fee) * N(pr.qty) : N(s.setup_fee)); pr.one_time = Math.round((N(pr.one_time) - waived) * 1000) / 1000; }
    // خصم الكمية: الفرق بين السعر الأصلي والسعر بعد الخصم
    const vol = s.ptype === 'unit' && N(pr.off) > 0 ? Math.round((N(s.price) * N(pr.qty) - N(pr.monthly)) * 1000) / 1000 : 0;
    return {id, s, it, ...pr, waived, vol}; }).filter(Boolean);
}
const why = s => { const m = (s.problems || []).filter(k => S.problems.includes(k)); return m.length ? 'مقترحة لأنك اخترت: ' + m.slice(0, 2).map(plabel).join('، ') : ''; };
function priceLabel(s) {
  switch (s.ptype) {
    case 'monthly': return jd(s.price) + ' شهرياً';
    case 'unit': return jd(s.price) + ' لكل ' + (s.unit || 'وحدة');
    case 'one_time': return jd(s.price) + ' مرة وحدة';
    case 'pct_spend': return N(s.pct) + '% من صرف الإعلانات' + (N(s.min_fee) ? '، وأقل إشي ' + jd(s.min_fee) : '');
    case 'team': return 'حسب الساعات والقنوات';
    case 'quote': return 'بيتسعّر بعد جلسة';
  }
  return '';
}

function quickForm() { return window.OopsQF.html(SITE?.config || {}, SITE?.logo, SITE?.brand); }
const qfSent = {};
function qf(ev, note) { try { window.clarity?.('event', 'qf_' + ev); if (ev === 'ok') window.clarity?.('set', 'lead', 'yes'); } catch (x) {} if (!sb || !VID || (qfSent[ev] && !['bad','err','wad'].includes(ev))) return; qfSent[ev] = 1; try { sb.rpc('oops_qf', {vid: VID, ev, note: note ? String(note).slice(0, 200) : null}).then(() => {}, () => {}); } catch (x) {} }
function qfWatch() {
  const f = $('#qform'); if (!f) return;
  // أحداث صارت قبل ما يتحمّل الموقع
  (window.__qfq || []).forEach(ev => qf(ev)); window.__qfq = null;
  if ('IntersectionObserver' in window) { const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { qf('seen'); io.disconnect(); } }, {threshold: .35}); io.observe(f); } else qf('seen');
  f.addEventListener('focusin', e => { if (!e.target.closest('.qwa')) qf('focus'); });
  const nm = $('#q_name'), ph = $('#q_phone'), cc = $('#q_cc');
  nm?.addEventListener('input', () => { if (nm.value.trim().length >= 2) qf('name'); });
  const chk = () => { const ok = !!window.OopsQF.norm(ph.value, cc.value); ph.closest('.qin')?.classList.toggle('ok', ok); if (ok) qf('phone');
    const c = window.OopsQF.CC.find(x => x[0] === cc.value); if (c) ph.placeholder = c[3]; };
  ph?.addEventListener('input', chk); cc?.addEventListener('change', chk); if (ph?.value) chk();
  const dw = $('#qwaDirect'), wc = SITE?.config || {};
  if (dw && waNum(wc.whatsapp)) { dw.href = waLink((wc.whatsapp_msg || 'مرحبا، بدي أستفسر عن خدماتكم') + ' ' + window.OopsQF.tag()); dw.hidden = false; }
  // الكبس على العرض أو النقاط بيودّي على خانة الاسم (كانوا ينكبسوا وما يصير إشي)
  f.addEventListener('click', ev => { if (ev.target.closest('[data-qfocus]')) { ev.preventDefault(); nm?.focus(); } });
}

      const waived = (q.items || []).reduce((a, i) => a + N(i.waived), 0);
      const row = (l, v, cls = '') => `<div class="${cls}"><span>${l}</span><b>${v}</b></div>`;
      return `<div class="rsum" style="max-width:400px;margin-inline-start:auto">
        ${row('أتعاب شهرية', jd(q.fees_monthly))}
        ${N(q.discount) ? row('خصم' + (N(q.discount_pct) ? ' ' + N(q.discount_pct) + '%' : ' شهري'), '−' + jd(q.discount), 'gift') + row('الأتعاب بعد الخصم', jd(total)) : ''}
        ${vm === 'excl' ? row(`ضريبة المبيعات ${N(q.vat_rate)}%`, jd(vatOf(total))) : ''}
        ${vm === 'incl' ? row(`شاملة ضريبة المبيعات ${N(q.vat_rate)}%`, '✓') : vm === 'exempt' ? row('معفي من الضريبة', '✓') : ''}
        ${waived ? row(`رسوم الإعداد <s>${jd(waived)}</s>`, 'مجاناً', 'gift') : ''}
        ${ad ? row('ميزانية الإعلانات <small class="m">(بتدفعها للمنصات مباشرة)</small>', jd(ad), 'ads') : ''}
        <div class="tot"><span>السعر النهائي شهرياً${vm === 'excl' ? ' <small class="m">(شامل الضريبة)</small>' : ''}${ad ? ' <small class="m">+ الإعلانات</small>' : ''}</span><b>${jd(monthly + ad)}</b></div>
        ${ad ? '' : '<div class="adsx"><span>+ مصاريف الإعلانات</span><b>حسب ميزانيتك</b></div><small class="m" style="display:block;text-align:start">ميزانية الإعلانات بتدفعها للمنصات (فيسبوك، تيك توك، جوجل...) مباشرة، ومش من ضمن السعر.</small>'}
        ${one ? `<div style="margin-top:6px"><span>رسوم لمرة وحدة${vm === 'excl' ? ' مع الضريبة' : ''} <small class="m">(أول شهر بس)</small></span><b>${jd(one + vatOf(one))}</b></div><div class="tot"><span>السعر النهائي لأول شهر${ad ? '' : ' <small class="m">+ الإعلانات</small>'}</span><b>${jd(first + ad)}</b></div>` : ''}
      </div>`; })()}
    ${ready && (q.plan || []).length ? `<h3 style="margin-top:22px">🗓️ خطتنا معك لـ 3 شهور</h3><div class="qplan3">${q.plan.map((m, i) => `<div><em>${i + 1}</em><b>${esc(m.title || 'الشهر ' + (i + 1))}</b><ul>${(m.points || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
    ${ready && q.suggestions ? `<h3 style="margin-top:20px">💡 اقتراحاتنا إلك</h3><ul class="qsugg">${String(q.suggestions).split('\n').map(x => x.trim()).filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${ready && q.terms ? `<h3 style="margin-top:20px">الشروط</h3><p class="m" style="white-space:pre-line;margin-top:6px">${esc(q.terms)}</p>` : ''}
    ${ready && q.valid_until ? `<p class="qdead">⏳ العرض صالح 7 أيام من تاريخ إصداره، ولازم توقيع العقد قبل <b>${esc(q.valid_until)}</b></p>` : ''}
    ${q.contract ? `<div class="qsign noprint"><b>📝 العقد جاهز للتوقيع</b><a class="btn pri" href="./c.html?c=${encodeURIComponent(q.contract)}">افتح العقد ووقّع</a></div>` : ''}
    <div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">${q.status === 'عرض مرسل' ? '<button class="btn pri" id="qOk">موافق على العرض</button><button class="btn ghost" id="qNo">بدي تعديل أو برفض</button>' : ''}<button class="btn ghost" onclick="print()">احفظ PDF أو اطبع</button></div>
    <p class="err" id="qErr"></p>${(() => { const c = SITE.config || {}; const x = [c.legal_name, c.address, c.phone, c.email].filter(Boolean); return x.length ? `<p class="m" style="margin-top:18px;font-size:13px;border-top:1px solid var(--line);padding-top:10px">${x.map(esc).join(' · ')}</p>` : ''; })()}</div>`;
  const answer = async (ok) => {
    let note = null;
    if (!ok) { const box = $('#qNote'); if (!box) { $('#qErr').insertAdjacentHTML('beforebegin', '<label class="fld noprint" id="qNoteW"><span>شو التعديل اللي بدك إياه، أو ليش مش مناسب؟</span><textarea id="qNote" rows="3" maxlength="500"></textarea></label><button class="btn pri noprint" id="qNoSend" style="margin-top:10px">ابعت الرد</button>'); $('#qNote').focus(); $('#qNoSend').onclick = () => answer(false, true); return; } note = box.value.trim(); }
    const {error: e} = await sb.rpc('oops_quote_answer', {tok, ok, note});
    if (e) { $('#qErr').textContent = friendly(e.message); return; }
    if (ok) track('Schedule', {}); quotePage(tok);
  };
  $('#qOk') && ($('#qOk').onclick = () => answer(true));
  $('#qNo') && ($('#qNo').onclick = () => answer(false));
}

/* ---------- ربط الأحداث ---------- */
function bind() {
  document.addEventListener('click', e => {
    const v = e.target.closest('[data-yt]'); if (v) { e.preventDefault(); const id = v.dataset.yt; const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0'; f.title = v.getAttribute('aria-label') || 'فيديو'; f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen = true; f.className = v.className; v.replaceWith(f);
      track('VideoPlay', {id}); try { window.clarity?.('event', 'video_play'); } catch (x) {} return; }
    if (e.target.closest('[data-qgo]')) { e.preventDefault(); $('#qform')?.scrollIntoView({behavior: 'smooth', block: 'center'}); setTimeout(() => $('#q_name')?.focus(), 500); }
  });
  let calcOn = false; document.addEventListener('input', e => { if (!calcOn && e.target.closest?.('#toolBody')) { calcOn = true; track('CalcStart', {tool: TOOL}); } });
  document.addEventListener('click', e => {
    const t = e.target.closest('button,a'); if (!t) return;
    if (t.matches('[data-start]') && !S.started) { S.started = true; save(); track('ViewContent', {content_name: 'builder'}); }
    if (t.dataset.tab) { TOOL = t.dataset.tab; drawTools(); return; }
    if (!$('#wiz')?.contains(t)) { if (t.id === 'mOpen') { document.body.classList.add('rshow'); } if (t.id === 'rClose') document.body.classList.remove('rshow'); return; }
    if (t.dataset.prob && !S.started) { S.started = true; track('ViewContent', {content_name: 'builder'}); funnel(1); stepUrl(false); }
    if (t.dataset.prob) { const k = t.dataset.prob; S.problems = S.problems.includes(k) ? S.problems.filter(x => x !== k) : [...S.problems, k]; t.setAttribute('aria-pressed', pressed(S.problems.includes(k))); save(); err(''); return; }
    if (t.dataset.sector != null) { readStep(); S.sector = t.dataset.sector; drawStep(); return; }
    if (t.dataset.stage) { readStep(); S.stage = t.dataset.stage; drawStep(); return; }
    if (t.dataset.agnow) { readStep(); S.agency_now = t.dataset.agnow; drawStep(); return; }
    if (t.dataset.cat) { S.cat = t.dataset.cat; drawStep(); return; }
    if (t.dataset.add && !S.items[t.dataset.add] && !Object.keys(S.items).length) track('AddToCart', {content_name: svc(t.dataset.add)?.name || ''});
    if (t.dataset.add) { toggleItem(t.dataset.add); if (!S.started) { S.started = true; track('ViewContent', {content_name: 'builder'}); } drawStep(); return; }
    if (t.dataset.qty) { const s = svc(t.dataset.qty), it = S.items[s.id]; it.qty = Math.max(N(s.min_qty), Math.min(N(s.max_qty), N(it.qty) + N(t.dataset.d))); drawStep(); return; }
    const team = () => Object.keys(S.items).map(svc).find(s => s.ptype === 'team');
    if (t.dataset.team) { const s = team(), o = S.items[s.id].opts; o.agents = Math.max(1, Math.min(s.params?.max_agents || 6, o.agents + N(t.dataset.d))); drawStep(); return; }
    if (t.dataset.tch) { const o = S.items[team().id].opts, c = t.dataset.tch; o.channels = o.channels.includes(c) ? o.channels.filter(x => x !== c) : [...o.channels, c]; drawStep(); return; }
    if (t.dataset.ttask) { const o = S.items[team().id].opts, c = t.dataset.ttask; o.tasks = o.tasks.includes(c) ? o.tasks.filter(x => x !== c) : [...o.tasks, c]; drawStep(); return; }
    if (t.dataset.go != null) { readStep(); S.step = N(t.dataset.go); drawStep(true); return; }
    if (t.matches('[data-back]')) { readStep(); S.step = Math.max(0, S.step - 1); drawStep(true); return; }
    if (t.matches('[data-next]')) { readStep(); const m = validate(); if (m) return err(m); if (S.step === 2 && !Object.keys(S.items).length) { runPlan(); return; } S.started = true; S.step++; if (S.step === 4) track('InitiateCheckout', {}); drawStep(true); return; }
    if (t.id === 'doPlan') { const m = (readStep(), validate()); if (m) return err(m); runPlan(); return; }
    if (t.id === 'send') { send(); return; }
    if (t.id === 'otpGo') { checkCode(); return; }
    if (t.id === 'otpSkip') { S.vskip = true; const vb = $('#vbox'); if (vb) vb.innerHTML = ''; const sb2 = $('#send'); if (sb2) sb2.hidden = false; send(); return; }
    if (t.id === 'otpRe') { readStep(); requestCode(); return; }
    if (t.dataset.vch) { readStep(); S.vch = t.dataset.vch; drawStep(); return; }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.tv) { tv[t.dataset.tv] = t.value; ls.set('oops-tools', tv); if (t.dataset.tv === 'sector') { tv.cpl = ''; drawTools(); } else calcTools(); return; }
    if (!$('#wiz')?.contains(t)) return;
    if (t.id === 'otp' && t.value.replace(/\D/g, '').length === 6) { checkCode(); return; }
    if (t.id === 'r_budget') { $('#i_budget').value = t.value; }
    if (t.id === 'i_budget') { $('#r_budget').value = t.value; }
    if (['r_budget','i_budget','i_ad'].includes(t.id) || t.dataset.split) { readStep(); const sp = $$('.split b'); if (sp.length) { sp[0].textContent = jd(adBudget()); sp[1].textContent = jd(feesBudget()); } drawReceipt(); save(); }
    if (t.dataset.teamsel) { const s = Object.keys(S.items).map(svc).find(x => x.ptype === 'team'); S.items[s.id].opts[t.dataset.teamsel] = N(t.value); if (t.dataset.teamsel !== 'msgs') drawStep(); else { drawReceipt(); save(); clearTimeout(bind.t); bind.t = setTimeout(() => { drawStep(); const m = $('#t_m'); if (m) { m.focus(); m.setSelectionRange?.(99, 99); } }, 700); } }
  });
  document.addEventListener('change', e => { if (e.target.id === 'i_inc') { readStep(); drawStep(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('rshow'); });
}

/* ---------- التشغيل ---------- */
async function boot() {
  if (!cfg.url || !cfg.key || !window.supabase?.createClient) { $('#app').innerHTML = '<div class="center"><p>الصفحة مش مجهزة. تأكد من config.js</p></div>'; return; }
  sb = window.supabase.createClient(cfg.url, cfg.key, {auth: {persistSession: false}});
  const {data, error} = await sb.rpc('oops_site_data');
  if (error || !data) { $('#app').innerHTML = '<div class="center"><div><h2>ما قدرنا نحمّل الصفحة</h2><p class="m">تأكد من الإنترنت وحدّث الصفحة.</p></div></div>'; return; }
  SITE = data;
  const brand = SITE.brand || 'OOPSIDE';
  $('#brandName').textContent = brand; $('#fBrand').textContent = brand;
  if (SITE.logo) { $('#brand').innerHTML = `<img src="${esc(SITE.logo)}" alt="${esc(brand)}">`; document.querySelector('link[rel=icon]').href = SITE.logo; }
  document.title = brand + ' | وكالة تسويق رقمي: أسعار واضحة وإعلانات بتجيب زباين';
  const c = SITE.config || {};
  const intl = p => { const d = String(p || '').replace(/\D/g, ''); return /^07[789]\d{7}$/.test(d) ? '+962 ' + d.slice(1, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6) : /^9627[789]\d{7}$/.test(d) ? '+962 ' + d.slice(3, 5) + ' ' + d.slice(5, 8) + ' ' + d.slice(8) : String(p || ''); };
  $('#fContact').innerHTML = [c.whatsapp ? `<a href="${esc(waLink((c.whatsapp_msg || 'مرحبا، بدي أستفسر عن خدماتكم') + ' ' + window.OopsQF.tag()))}" target="_blank" rel="noopener" data-wa-direct>واتساب <span dir="ltr">${esc(intl(c.whatsapp))}</span></a>` : '', c.phone && String(c.phone).replace(/\D/g, '') !== String(c.whatsapp || '').replace(/\D/g, '') ? `<a href="tel:${esc(String(c.phone).replace(/[^0-9+]/g, ''))}">هاتف <span dir="ltr">${esc(intl(c.phone))}</span></a>` : '',
    (c.days || c.hours) ? `<span style="opacity:.8">الدوام: ${esc([c.days, c.hours].filter(Boolean).join('، '))}</span>` : '', c.reply_promise ? `<span style="opacity:.8">${esc(c.reply_promise)}</span>` : '', c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '',
    c.address ? (c.maps_url ? `<a href="${esc(safeUrl(c.maps_url))}" target="_blank" rel="noopener">${esc(c.address)}</a>` : `<span style="opacity:.8">${esc(c.address)}</span>`) : ''].filter(Boolean).join('');
  $('#fSocial').innerHTML = SOCIAL.filter(([k]) => c[k]).map(([k, l]) => `<a href="${esc(safeUrl(c[k]))}" target="_blank" rel="noopener">${l}</a>`).join('');
  if (c.about) $('#fAbout').textContent = c.about;
  $('#fLegal').textContent = [c.legal_name, c.cr ? 'سجل تجاري ' + c.cr : ''].filter(Boolean).join(' · ');
  const wn = waNum(c.whatsapp);
  if (wn) { const wa = $('#wa'); wa.hidden = false; wa.href = waLink((c.whatsapp_msg || 'مرحبا، بدي أستفسر عن خدماتكم') + ' ' + window.OopsQF.tag()); wa.setAttribute('data-wa-direct', ''); }
  // أي كبسة واتساب مباشرة (الزر العائم، الفوتر، تحت الفورم): حدث تحويل
  document.addEventListener('click', e => { const a = e.target.closest('[data-wa-direct]'); if (!a) return; track('Contact', {via: a.id || 'link'}); qf('wad'); });
  loadTracking(SITE);
  bind();
  const tok = qs.get('q');
  if (tok) { $$('header a[href^="#"], footer a.brand').forEach(a => a.setAttribute('href', location.pathname + (a.getAttribute('href') === '#' ? '' : a.getAttribute('href')))); await quotePage(tok); if (qs.get('print')) setTimeout(() => print(), 900); return; }
  if (!SITE.live && !qs.has('preview')) { $('#app').innerHTML = `<div class="center"><div><h1>${esc(brand)}</h1><p class="m" style="margin-top:10px">الموقع بيتجهز. ارجعلنا قريب.</p></div></div>`; return; }
  try { localStorage.setItem('oops-qcfg', JSON.stringify({quick_on: c.quick_on, quick_title: c.quick_title, quick_offer: c.quick_offer, quick_points: c.quick_points, quick_btn: c.quick_btn, quick_trust: c.quick_trust})); } catch (x) {}
  const keep = {}, act = document.activeElement?.id; ['q_name', 'q_phone'].forEach(k => { const v = document.getElementById(k)?.value; if (v) keep[k] = v; });
  $('#app').innerHTML = home();
  Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; });
  if (act && /^q_/.test(act)) document.getElementById(act)?.focus();
  S.step = Math.min(N(S.step), 4);
  Object.keys(S.items).forEach(id => { if (!svc(id)) delete S.items[id]; });
  drawStep(); drawTools(); funnel(0); setTimeout(livePing, 1500); setTimeout(qfWatch, 800);
  // شريط الفاتورة تحت (بالجوال) بس لما يوصل لباني الباقة، عشان ما يغطي زر الفورم
  { const b = $('#build'); if (S.started) document.body.classList.add('bshow'); else if (b && 'IntersectionObserver' in window) { const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { document.body.classList.add('bshow'); io.disconnect(); } }); io.observe(b); } else document.body.classList.add('bshow'); }
  document.addEventListener('submit', e => { if (e.target?.id === 'qform') quickSubmit(e); });
  if (window.__qEarly && $('#qform')) { window.__qEarly = 0; quickSubmit({preventDefault() {}}); }
  addEventListener('popstate', () => { const m = /[?&]step=(\d)/.exec(location.search); if (!m) return; const st = N(m[1]) - 1; if (st >= 0 && st <= 4 && st <= N(S.maxStep) && $('#wiz .prog')) { readStep(); S.step = st; $('#wiz').innerHTML = stepHtml(); drawReceipt(); save(); } });
  if (!SITE.live) $('#build .sechead p').insertAdjacentHTML('beforeend', ' <b style="color:var(--coral)">(معاينة: الموقع مطفي، والإرسال مسكّر)</b>');
}
window.OopsApp = {state: () => S, site: () => SITE};
boot();
})();
</script>
